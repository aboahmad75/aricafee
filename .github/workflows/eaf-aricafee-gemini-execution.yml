name: EAF AriCafee Gemini Execution

on:
  push:
    branches:
      - eaf/qa-runtime-precheck-01
    paths:
      - .github/workflows/eaf-aricafee-gemini-execution.yml

permissions:
  contents: write

concurrency:
  group: eaf-aricafee-representative-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout authorized pilot branch
        uses: actions/checkout@v5
        with:
          ref: eaf/aricafee-representative-pilot-01
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authorized baseline
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_BRANCH="eaf/aricafee-representative-pilot-01"
          EXPECTED_HEAD="a4ce82a26f283554e4fb03e320a3ae573f864d1e"

          ACTUAL_BRANCH="$(git branch --show-current)"
          ACTUAL_HEAD="$(git rev-parse HEAD)"

          echo "EXPECTED_BRANCH=$EXPECTED_BRANCH"
          echo "ACTUAL_BRANCH=$ACTUAL_BRANCH"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"

          test "$ACTUAL_BRANCH" = "$EXPECTED_BRANCH"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Run bounded Gemini execution
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          gemini_debug: false
          upload_artifacts: false
          settings: |-
            {
              "billing": {
                "overageStrategy": "never"
              },
              "model": {
                "maxSessionTurns": 8,
                "compressionThreshold": 0.3,
                "disableLoopDetection": false,
                "summarizeToolOutput": {
                  "run_shell_command": {
                    "tokenBudget": 1000
                  }
                }
              },
              "privacy": {
                "usageStatisticsEnabled": false
              },
              "tools": {
                "core": [
                  "list_directory",
                  "read_file",
                  "grep_search",
                  "replace",
                  "write_file"
                ]
              }
            }
          prompt: |-
            EAF — AriCafee Representative Website Delivery Pilot

            Execution provider substitution:
            GitHub Actions + Gemini CLI.

            Repository:
            aboahmad75/aricafee

            Authorized branch:
            eaf/aricafee-representative-pilot-01

            Authorized starting baseline HEAD:
            a4ce82a26f283554e4fb03e320a3ae573f864d1e

            Read before editing:
            - AGENTS.md
            - .github/copilot-instructions.md
            - README.md
            - index.html

            OBJECTIVE
            Produce a bounded, meaningful, reviewable improvement to the
            existing AriCafee website.

            This is not a greenfield build and not a redesign mandate.

            The website must remain:
            - static HTML;
            - Tailwind CDN;
            - Lucide;
            - browser JavaScript;
            - bilingual English/Arabic.

            HARD BOUNDARIES
            - Modify index.html only.
            - Do not modify AGENTS.md.
            - Do not modify .github/copilot-instructions.md.
            - Do not modify README.md.
            - Do not create or modify workflows.
            - Do not create files other than editing index.html.
            - Do not change repository settings or branches.
            - Do not commit or push; the workflow handles that later.
            - Do not deploy.
            - Do not add backend, database, authentication, DNS, billing,
              analytics, or production infrastructure.
            - Do not migrate to React or another framework.
            - Do not add project dependencies.
            - Do not perform web search or fetch external pages.
            - Do not invent unknown real-world business information.
            - Do not fabricate address, hours, phone, WhatsApp destination,
              social profiles, reviews, menu prices, or order destinations.

            AUDIT BEFORE EDITING
            Distinguish:
            A. functional defects;
            B. placeholder or unverifiable content/data;
            C. UX/design weaknesses;
            D. responsive/layout risks;
            E. bilingual LTR/RTL risks;
            F. items requiring Owner/business evidence.

            Known baseline concerns include:
            - CTA labels that may imply functionality not actually wired;
            - placeholder order widget/iframe;
            - placeholder address/hours/social links;
            - hard-coded reviews;
            - footer date;
            - external resources;
            - responsive behavior;
            - RTL behavior.

            Prefer the smallest high-impact improvements justified by the
            current source.

            IMPLEMENTATION PRIORITIES
            1. Clarify what is real versus placeholder/demo content.
            2. Make CTA semantics honest and non-misleading.
            3. Improve responsive usability.
            4. Preserve language toggle and LTR/RTL behavior.
            5. Improve hierarchy, semantic structure, and accessibility basics.
            6. Do not fabricate business facts.

            You may edit:
            - HTML;
            - Tailwind classes;
            - existing inline/browser JavaScript.

            SELF-CHECK BEFORE FINISHING
            Confirm:
            - only index.html changed;
            - bilingual toggle remains logically intact;
            - important section anchors/IDs remain internally consistent;
            - no fabricated real business information was introduced;
            - no production/configuration changes were made;
            - no framework migration occurred.

            Do not claim visual QA PASS.
            Independent Playwright QA is a separate verification layer.

            FINAL RESPONSE FORMAT

            PLANNED CHANGES:
            1.
            2.
            3.

            IMPLEMENTED CHANGES:
            1.
            2.
            3.

            PLACEHOLDER / OWNER EVIDENCE REQUIRED:
            - ...

            SOURCE-LEVEL CHECKS:
            PASS / FAIL / BLOCKED
            Evidence: ...

            BILINGUAL LTR/RTL PRESERVATION:
            PASS / FAIL / BLOCKED
            Evidence: ...

            VISUAL QA:
            DEFERRED TO INDEPENDENT QA

            FILES CHANGED:
            index.html only / otherwise list unexpected files

            RETRIES / FAILURES:
            NONE or details

            FINAL DIFF SCOPE:
            PASS / FAIL

            EXECUTION VERDICT:
            READY FOR INDEPENDENT QA
            or
            NOT READY FOR INDEPENDENT QA

      - name: Remove Gemini runtime files
        if: always()
        shell: bash
        run: |
          rm -rf .gemini
          rm -f gha-creds-*.json

      - name: Enforce execution scope
        shell: bash
        run: |
          set -euo pipefail

          echo "=== GIT STATUS ==="
          git status --short

          CHANGED="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sort -u | sed '/^$/d'
          )"

          echo "=== CHANGED PATHS ==="
          printf '%s\n' "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "ERROR: Gemini produced no repository change."
            exit 1
          fi

          if [ "$CHANGED" != "index.html" ]; then
            echo "ERROR: Scope violation. Only index.html may change."
            exit 1
          fi

          git diff --check
          grep -q 'id="langToggle"' index.html
          grep -q "addEventListener('click'" index.html
          grep -q 'dir="ltr"' index.html
          grep -q 'lang="en"' index.html

      - name: Capture execution evidence before commit
        shell: bash
        env:
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
          GEMINI_ERROR: ${{ steps.gemini.outputs.error }}
        run: |
          set -euo pipefail

          git diff -- index.html > "${RUNNER_TEMP}/aricafee-implementation.diff"

          {
            echo "BASELINE_HEAD=a4ce82a26f283554e4fb03e320a3ae573f864d1e"
            echo
            echo "=== GEMINI SUMMARY ==="
            printf '%s\n' "$GEMINI_SUMMARY"
            echo
            echo "=== GEMINI ERROR ==="
            printf '%s\n' "$GEMINI_ERROR"
            echo
            echo "=== PRE-COMMIT STATUS ==="
            git status --short
          } > "${RUNNER_TEMP}/eaf-gemini-execution-evidence.txt"

      - name: Commit authorized implementation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "EAF Gemini Execution"
          git config user.email "eaf-gemini@users.noreply.github.com"

          git add index.html
          git commit -m "Improve AriCafee representative pilot website"

          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:eaf/aricafee-representative-pilot-01

          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Append final state to evidence
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "=== FINAL HEAD ==="
            echo "${FINAL_HEAD:-NOT_COMMITTED}"
            echo
            echo "=== FINAL STATUS ==="
            git status --short || true
          } >> "${RUNNER_TEMP}/eaf-gemini-execution-evidence.txt"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaf-aricafee-gemini-execution
          path: |
            ${{ runner.temp }}/aricafee-implementation.diff
            ${{ runner.temp }}/eaf-gemini-execution-evidence.txt
          if-no-files-found: warn
          retention-days: 14
